name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang kebergantungan
        run: pip install jsonschema
      - name: Validasi data (jana laporan)
        run: python tools/validate.py --report
      - name: Simpan laporan sebagai artifak
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data_report
          path: reports/data_report.md
